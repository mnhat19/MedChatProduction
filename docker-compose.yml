version: '3.8'

services:
  backend:
    build:
      context: ./rag_project
      dockerfile: Dockerfile.backend
    ports:
      - "8001:8001"
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - ALLOWED_ORIGINS=http://localhost:3000
      - API_SECRET_KEY=${API_SECRET_KEY:-}
    volumes:
      - ./rag_project/faiss_cache:/app/faiss_cache
      - sessions_data:/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  sessions_data:
